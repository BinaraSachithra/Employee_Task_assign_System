<!DOCTYPE html>
    <html>
        <head>
            <title>ADMIN LOGIN</title>
            <style>
                *{
                    margin: 0; 
                    padding: 0;
                    box-sizing: border-box;
                    -webkit-font-smoothing: antialiased;
                }

                body{
                    background-color:transparent;
                    font-family:Verdana, Geneva, Tahoma, sans-serif;
                    background-image: url('Images/emp3_1.jpg');
                    background-repeat: no-repeat;
                    background-size:cover;
                }

                h1{
                    color:cornsilk;
                    text-align: center;
                    font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                    margin-top: 30px;
                }

                .container{
                    max-width: 700px;
                    margin: auto;
                    padding: 30px;
                    background-color:transparent;
                    border-radius: 40px;
                    box-shadow: 1px 1px 50px rgba(0, 0, 1, 2);
                }

                label{
                    display:inline-block;
                    font-weight: bolder;
                    margin-bottom: 10px;
                    color:seashell;
                }
                table{
                    width: 550px;
                    margin:auto;
                    font-size: 20px;
                }

                input[type="text"]{
                    width: 300px;
                    padding: 7px;
                    margin-bottom: 10px;
                    border-radius: 6px;
                    
                }

                input[type="password"]{
                    width: 300px;
                    padding: 7px;
                    margin-bottom: 10px;
                    border-radius: 6px;
                }

                input[type="number"]{
                    width: 300px;
                    padding: 7px;
                    margin-bottom: 10px;
                    border-radius: 6px;
                }

                input[type="submit"]{
                    text-align: center;
                    display: block;
                    margin: auto;
                    background-color: burlywood;
                    padding: 10px 50px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 15px;
                    font-weight: 800;
                }

                input[type="submit"]:hover{
                    opacity: 0.75;
                }


                .reset{
                    text-align: center;
                    display: block;
                    margin: auto;
                    background-color: burlywood;
                    padding: 10px 50px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 15px;
                    font-weight: 800;
                }

                input[type="submit"]:hover{
                    opacity: 0.75;
                }

                span.psw{
                    float: right;
                    padding-top: 16px;
                    color: seashell;
                }
            </style>
        </head>

        <body>
            <h1 style="text-align:center;">Admin Login</h1>
            <div class="container">
                <form action="login.php" method="post">
                    <table>
                        <tr>
                        <th><label for="username"><b>User Name : </b></label></th>
                        <td><input type="text" placeholder="Enter User Name" name="username" id="username" required></td><br><br>
                        </tr>

                        <tr>
                        <th><label for="pw"><b>Password : </b></label></th>
                        <td><input type="password" placeholder="Enter Password" name="password" id="pw" required></td><br><br>
                        </tr>

                        <tr>
                        <th><input type="submit" id="submit" value="Login"></th>
                        </tr>

                        <tr>
                        <th><input type="reset" class="reset" id="reset" value="Reset"></th>
                        </tr>

                        <tr>
                        <th><span class="psw">Forgot <a href="#"> password? </a></span></th>
                        </tr>
                    </table>
                </form>
            </div>
        </body>
    </html>
